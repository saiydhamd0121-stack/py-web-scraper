
<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyAutomation Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #121110; color: #E6E2DE; } </style>
</head>
<body class="bg-[#121110] text-[#E6E2DE] p-4 antialiased">
    <div class="max-w-2xl mx-auto py-6">
        <h1 class="text-xl font-black text-center text-[#C5A059] mb-2">الذكاء الاصطناعي المميز ⚡</h1>
        <p class="text-xs text-[#A39E9B] text-center mb-6">قائمة البرمجيات والخدمات الرقمية الفاخرة</p>
        
        <div class="grid grid-cols-1 gap-4">
            {% for key, product in products.items() %}
                <div class="bg-[#1A1816] border border-[#2B2724] p-5 rounded-[2rem] shadow-xl flex flex-col justify-between">
                    <div>
                        <h3 class="text-sm font-bold text-[#F5F2EF] mb-1">{{ product.name }}</h3>
                        <p class="text-[#A39E9B] text-xs mb-3">{{ product.desc }}</p>
                        <div class="text-base font-black text-[#C5A059] mb-4">{{ product.price }} USDT</div>
                    </div>
                    
                    <form action="/order" method="POST" class="space-y-2 border-t border-[#2B2724] pt-3">
                        <input type="hidden" name="product_id" value="{{ key }}">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" name="customer_name" placeholder="الاسم الكامل" required class="w-full bg-[#121110] border border-[#2B2724] rounded-full px-3 py-1.5 text-xs text-[#E6E2DE] outline-none focus:border-[#C5A059]">
                            <input type="email" name="customer_email" placeholder="البريد الإلكتروني" required class="w-full bg-[#121110] border border-[#2B2724] rounded-full px-3 py-1.5 text-xs text-[#E6E2DE] outline-none focus:border-[#C5A059]">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" name="contact_info" placeholder="واتساب / تيليجرام" required class="w-full bg-[#121110] border border-[#2B2724] rounded-full px-3 py-1.5 text-xs text-[#E6E2DE] outline-none focus:border-[#C5A059]">
                            <input type="text" name="binance_tx" placeholder="معرف باينانس (TX ID)" required class="w-full bg-[#121110] border border-[#2B2724] rounded-full px-3 py-1.5 text-xs text-[#E6E2DE] outline-none focus:border-[#C5A059]">
                        </div>
                        <button type="submit" class="w-full bg-[#C5A059] hover:bg-[#b08d4c] text-black font-bold py-2 rounded-full text-xs uppercase tracking-wider transition shadow-md mt-2">طلب آمن</button>
                    </form>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
